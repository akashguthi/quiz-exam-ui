<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizExam | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <main class="d-flex justify-content-center align-items-center min-vh-100 page-wrap">
        <section class="login-form text-center p-4 p-sm-5" aria-labelledby="register-title">
            <div class="d-flex justify-content-start mb-3">
                <a href="index.html" class="back-link text-decoration-none">
                    <span aria-hidden="true">←</span> Back to Home
                </a>
            </div>

            <h1 id="register-title" class="mb-2 fw-semibold">Create your account</h1>
            <p class="sub-title mb-4">Sign up to start your exam journey.</p>

            <form class="text-start" action="register.php" method="post">
                <label class="form-label mb-2" for="username">Username</label>
                <input
                    id="username"
                    class="u1 mb-3"
                    type="text"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                    name="username"
                />

                <label class="form-label mb-2" for="email">Email</label>
                <input
                    id="email"
                    class="u1 mb-3"
                    type="email"
                    placeholder="Enter email"
                    required
                    autocomplete="email"
                    name="email"
                />

                <label class="form-label mb-2" for="password">Password</label>
                <input
                    id="password"
                    class="p1 mb-2"
                    type="password"
                    placeholder="Create password"
                    required
                    autocomplete="new-password"
                    name="password"
                />

                <label class="form-label mb-2" for="confirm_password">Confirm Password</label>
                <input
                    id="confirm_password"
                    class="p1 mb-3"
                    type="password"
                    placeholder="Confirm password"
                    required
                    autocomplete="new-password"
                    name="confirm_password"
                />

                <button type="submit" class="login1 mb-3">Sign Up</button>
            </form>

            <div class="d-flex justify-content-center gap-2 align-items-center">
                <span class="muted-text">Already have an account?</span>
                <a href="login.html" class="link-btn p-0 text-decoration-none">Login</a>
            </div>
        </section>
    </main>
</body>
</html>
