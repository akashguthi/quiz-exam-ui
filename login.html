<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizExam | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<main class="d-flex justify-content-center align-items-center min-vh-100 page-wrap">
    <section class="login-form text-center p-4 p-sm-5" aria-labelledby="login-title">
        <div class="d-flex justify-content-start mb-3">
            <a href="index.html" class="back-link text-decoration-none">
                <span aria-hidden="true">←</span> Back to Home
            </a>
        </div>
        <h1 id="login-title" class="mb-2 fw-semibold">Welcome Back</h1>
        <p class="sub-title mb-4">Sign in to continue your exam journey.</p>

        <form class="text-start" action="login.php" method="post">
            <label class="form-label mb-2" for="username">Username</label>
            <input id="username" class="u1 mb-3" type="text" placeholder="Enter username" required autocomplete="username" name="username"/>

            <label class="form-label mb-2" for="password">Password</label>
            <input id="password" class="p1 mb-2" type="password" placeholder="Enter password" required autocomplete="current-password" name="password"/>

            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="link-btn p-0">Forgot password?</button>
            </div>

            <button type="submit" class="login1 mb-3">Login</button>
        </form>

        <div class="d-flex justify-content-center gap-2 align-items-center">
            <span class="muted-text">New to QuizExam?</span>
            <a href="register.html" class="link-btn p-0 text-decoration-none">Sign up</a>
        </div>
    </section>
</main>

</body>
</html>
